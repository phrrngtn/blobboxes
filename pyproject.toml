[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blobboxes"
version = "0.4.5"
description = "Extract text bounding boxes, fonts, and styles from documents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Paul Harrington"}]
# blobzig is the family's shared ctypes plumbing (artifact discovery, the
# c_void_p result convention) — pure Python, no native code of its own. It is
# the only runtime dependency: extraction is all in libbboxes, reached through
# ctypes rather than a compiled extension module.
dependencies = ["blobzig"]
keywords = ["pdf", "xlsx", "docx", "bounding-box", "text-extraction", "duckdb", "sqlite", "browser", "web-scraping"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
browser = ["playwright>=1.40", "mitmproxy>=10.0"]
schema = ["pydantic>=2.0"]

[project.urls]
Repository = "https://github.com/phrrngtn/blobboxes"

# The default index (dc1 Forgejo) only carries the blob* wheels; the browser-extra
# packages live on pypi. Pin them there so `uv lock` can resolve the optional extra
# without disabling dependency-confusion protection for everything else.
# (Indexes referenced by tool.uv.sources must be declared here, not only in the user uv.toml.)
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[tool.uv.sources]
mitmproxy = { index = "pypi" }
playwright = { index = "pypi" }
blobzig = { path = "../blobzig", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["python/blobboxes"]

# hatch_build.py stamps the platform tag and picks which of zig-out/lib belongs
# in this wheel — that directory keeps artifacts from every target ever built.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
